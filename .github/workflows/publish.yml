name: 公众号每日自动推送

on:
  schedule:
    # 8次兜底：北京时间 06:30 ~ 11:00，每30分钟一次
    - cron: '30 22 * * *'   # UTC 22:30 = 北京 06:30
    - cron: '0 23 * * *'    # UTC 23:00 = 北京 07:00
    - cron: '30 23 * * *'   # UTC 23:30 = 北京 07:30
    - cron: '0 0 * * *'     # UTC 00:00 = 北京 08:00
    - cron: '30 0 * * *'    # UTC 00:30 = 北京 08:30
    - cron: '0 1 * * *'     # UTC 01:00 = 北京 09:00
    - cron: '30 1 * * *'    # UTC 01:30 = 北京 09:30
    - cron: '0 2 * * *'     # UTC 02:00 = 北京 10:00
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行推送
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          PLATFORM: github-actions
        run: node publish-today.js

      - name: 推送失败时告警
        if: failure()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          curl -s -X POST "$LARK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"msg_type":"text","content":{"text":"【公众号推送通知】🚨 GitHub Actions 执行失败\n请手动检查并重试"}}'
