name: 公众号每日自动推送

on:
  schedule:
    # 主推送：每天 UTC 00:15 = 北京时间 08:15
    - cron: '15 0 * * *'
    # 次推送：每天 UTC 00:45 = 北京时间 08:45
    - cron: '45 0 * * *'
    # 兜底：每天 UTC 01:15 = 北京时间 09:15
    - cron: '15 1 * * *'
    # 二次兜底：每天 UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行推送
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        run: node publish-today.js
