name: 公众号每日自动推送

on:
  schedule:
    # 主推送：每天北京时间 08:45
    - cron: '45 0 * * *'
    # 兜底：每天 09:05 再跑一次，防止网络波动
    - cron: '5 1 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行推送
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        run: node publish-today.js
