<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">下雨天。</p>

<p style="margin-bottom: 20px;">今天下雨没出门，她在客厅爬了一上午。从沙发爬到茶几，从茶几爬到我腿上，再从我腿上爬回沙发。循环了大概二十遍。</p>

<p style="margin-bottom: 15px;">中间停下来看了我一眼，像是在确认：你还在吧？我点头。她就继续爬。</p>
