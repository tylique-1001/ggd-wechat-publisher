<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">游泳圈初体验</p>

<p style="margin-bottom: 20px;">今天给她买了个小黄鸭游泳圈。</p>

<p style="margin-bottom: 20px;">套上，放澡盆里，她整个人浮起来，两脚扑腾。</p>

<p style="margin-bottom: 20px;">水花溅我一脸。</p>

<p style="margin-bottom: 20px;">她不害怕，反而兴奋，手拍水面"啪啪"，嘴里"驾驾"像在开船。</p>

<p style="margin-bottom: 20px;">我在旁边扶着，怕她翻。</p>

<p style="margin-bottom: 20px;">她扭头看我，一脸"你别管我自己来"的表情。</p>

<p style="margin-bottom: 15px;">洗完捞出来，她还伸手要回水里去。澡盆船长，任职第一天，表现优秀。</p>
