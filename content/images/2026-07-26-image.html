<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">西瓜汁糊一脸</p>

<p style="margin-bottom: 20px;">今天第一次给小Xi吃西瓜。</p>

<p style="margin-bottom: 20px;">之前喂南瓜泥，她眉头皱成八字，吐得我一身。我都快怀疑她不爱吃辅食了。</p>

<p style="margin-bottom: 20px;">西瓜一递到嘴边，她眼睛亮了。咬下去，汁水顺着下巴淌，两只手抓着啃，糊得脸蛋头发全红。</p>

<p style="margin-bottom: 20px;">我在旁边笑，妈妈举着手机："慢点，别呛着。"</p>

<p style="margin-bottom: 15px;">原来不是不爱吃，是没遇到对的。</p>
