<p style="margin-bottom: 15px; text-align: center; color: #888; font-size: 13px;">🌙</p>

<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">她睡着了。</p>

<p style="margin-bottom: 20px;">睡前闹了快四十分钟。不躺，不坐，不在床上，不在我怀里。最后趴在我胸口上，耳朵贴着心跳，安静了。两分钟不到，呼吸就匀了。</p>

<p style="margin-bottom: 20px;">我低头看了一眼——嘴巴微张，睫毛长长的，两只手攥着我的衣领。</p>

<p style="margin-bottom: 15px;">就是这一刻。等了一整天，就为了这一刻。</p>
