<p style="margin-bottom: 15px; text-align: center; color: #888; font-size: 13px;">☀️</p>

<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">阳光照进来。</p>

<p style="margin-bottom: 20px;">今天天终于晴了，带她下楼晒太阳。她坐在婴儿车里，眯着眼看天，嘴巴微微张开。风吹过来，她头发飘了一下。</p>

<p style="margin-bottom: 15px;">这是她第一次不是在哭、不是在吃、不是在睡——而是在"看"这个世界。安安静静地看。</p>
