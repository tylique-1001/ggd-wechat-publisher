<p style="margin-bottom: 15px; text-align: center; color: #888; font-size: 13px;">🕑</p>

<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">半夜两点。</p>

<p style="margin-bottom: 20px;">她又醒了。没有哭。就是翻了个身，趴在床栏上，透过栏杆看我。黑暗中一双亮晶晶的小眼睛。我躺着一动不动假装睡着，过了大概三十秒，她也躺回去了。</p>

<p style="margin-bottom: 15px;">不确定她是不是真的醒了。可能只是梦到什么东西，醒来确认一下我还在不在。</p>
