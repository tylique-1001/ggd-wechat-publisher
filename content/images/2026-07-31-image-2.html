<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">睡前翻绘本</p>

<p style="margin-bottom: 20px;">今晚小Xi自己从书架抽了本绘本，塞我手里。</p>

<p style="margin-bottom: 20px;">翻到第一页，她"啊"，翻到第二页，她又"啊"。</p>

<p style="margin-bottom: 20px;">我念一遍，她没反应。又念一遍，她笑了。</p>

<p style="margin-bottom: 20px;">于是这本念了五遍。</p>

<p style="margin-bottom: 20px;">第五遍她自己接了最后一个词，虽然发音像打嗝。</p>

<p style="margin-bottom: 20px;">我合上书，她又抽出来塞我手里。</p>

<p style="margin-bottom: 15px;">行，第六遍。</p>
