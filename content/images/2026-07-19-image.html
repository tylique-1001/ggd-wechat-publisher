<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">她发现了镜子。</p>

<p style="margin-bottom: 20px;">今天在卫生间，她看到镜子里的自己，先愣住，然后伸手去摸镜子里那个"她"。摸不到，又伸手摸自己的脸。</p>

<p style="margin-bottom: 15px;">来回比对了好几次。她还没意识到那是自己。但她开始意识到：世界上有一种东西叫"像"。</p>
