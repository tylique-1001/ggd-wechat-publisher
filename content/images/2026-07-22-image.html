<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">硅胶围嘴，二十多块。</p>

<p style="margin-bottom: 20px;">小Xi吃饭像打仗，米糊、米饼、磨牙棒动不动就往脸上招呼。围嘴兜不住的，全糊在衣服上，一天换三套。老婆说「你看看你女儿」。</p>

<p style="margin-bottom: 20px;">后来换了这个软硅胶的。接得住，卷一卷就倒干净，水冲一下又跟新的一样。</p>

<p style="margin-bottom: 15px;">用了快一个月，暂时没发霉。推荐给所有正在被辅食糊一脸的爹妈 🥣</p>
