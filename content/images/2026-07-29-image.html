<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">半夜抱着转圈</p>

<p style="margin-bottom: 20px;">凌晨三点，小Xi又醒了。</p>

<p style="margin-bottom: 20px;">哭声不大，但很执拗，像是在说该起来了。妈妈翻了个身，把枕头压在耳朵上。我知道这班轮到我了。</p>

<p style="margin-bottom: 20px;">抱起来，客厅没开大灯，只留玄关那盏暖黄的。我绕着茶几走，一圈，两圈，三圈。</p>

<p style="margin-bottom: 20px;">她脸贴在我肩膀上，呼吸慢慢变长。可我一停，她眼睛就睁开了，像装了感应器。</p>

<p style="margin-bottom: 20px;">于是继续转。转到第七圈，她终于不动了，手从脖子上滑下来，垂在我背后面。</p>

<p style="margin-bottom: 20px;">放回小床，她翻个身，咂咂嘴。我站在旁边听了半天，确认睡熟了才敢走。</p>

<p style="margin-bottom: 15px;">回床上已经四点。枕头还是热的，可我睡不着了，脑子里全是一个圈一个圈的客厅。</p>
