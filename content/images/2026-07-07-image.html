<p style="margin-bottom: 20px; text-align: center; font-size: 16px;">她会递东西给我了。</p>

<p style="margin-bottom: 20px;">午饭的时候，她正在吃米饼，咬了几口，突然把剩下的半块举到我嘴边。我张嘴吃了。她看着我嚼，笑了。</p>

<p style="margin-bottom: 20px;">然后又拿了一块新的咬了一口，又递过来。</p>

<p style="margin-bottom: 15px;">一岁多的分享，大概就是这个样子——把沾满口水的食物塞到你嘴里，然后期待地看着你的反应。我真觉得挺好吃的。</p>
